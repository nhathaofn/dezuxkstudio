name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TASK_VERSION: v3.53.1
  WAILS_VERSION: v2.17.0 # keep equal to github.com/wailsapp/wails/v2 in go.mod
  NODE_VERSION: '22'

jobs:
  check:
    name: Lint, test & build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install tools
        shell: bash
        run: |
          go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - run: task setup
      - run: task lint
      - run: task test

      - name: Race detector
        if: runner.os != 'Windows'
        run: task test:race

      - run: task build:server
      - run: task build

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}
      - run: task setup
      - run: task audit
