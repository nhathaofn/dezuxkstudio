name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  TASK_VERSION: v3.53.1
  WAILS_VERSION: v2.17.0 # keep equal to github.com/wailsapp/wails/v2 in go.mod
  NODE_VERSION: '22'

jobs:
  build:
    name: Build & publish (Windows)
    runs-on: windows-latest
    env:
      # Taskfile reads these; the release feed lets the app find newer releases.
      VERSION: ${{ github.ref_name }}
      UPDATE_FEED_URL: https://api.github.com/repos/${{ github.repository }}/releases/latest
      # Optional signing material. Signing is skipped when the secret is absent.
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install tools
        shell: bash
        run: |
          go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - name: Normalise version
        shell: bash
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - run: task setup
      - run: task check
      - name: Build
        shell: bash
        run: |
          task build VERSION="$VERSION" UPDATE_FEED_URL="$UPDATE_FEED_URL"
          task build:server VERSION="$VERSION" UPDATE_FEED_URL="$UPDATE_FEED_URL"

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build Windows installer
        shell: bash
        run: task build:installer VERSION="$VERSION" UPDATE_FEED_URL="$UPDATE_FEED_URL"

      - name: Sign Windows binaries
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object FullName -match 'x64' | Select-Object -Last 1
          Get-ChildItem build/bin, bin -Filter *.exe -Recurse | ForEach-Object {
            & $signtool.FullName sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f $pfx /p $env:WINDOWS_CERT_PASSWORD $_.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Remove-Item $pfx

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist
          suffix="${{ runner.os }}-$(uname -m)"
          for f in build/bin/* bin/*; do
            name="$(basename "$f")"
            if [ -f "$f" ] && [[ "$name" == *.exe ]]; then
              cp "$f" "dist/${name%.exe}-${suffix}.exe"
            fi
          done
          cd dist
          for f in *.exe; do sha256sum "$f" > "$f.sha256"; done
          ls -l

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
