name: Release & Distribute

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: DezuxkStudio-windows-amd64.exe
            build_cmd: wails build -platform windows/amd64 -clean -o DezuxkStudio.exe
            built_path: build/bin/DezuxkStudio.exe
          - os: ubuntu-latest
            artifact_name: DezuxkStudio-linux-amd64
            build_cmd: wails build -platform linux/amd64 -clean -o DezuxkStudio
            built_path: build/bin/DezuxkStudio
          - os: macos-latest
            artifact_name: DezuxkStudio-darwin-universal.zip
            build_cmd: wails build -platform darwin/universal -clean
            built_path: build/bin/DezuxkStudio.app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev build-essential pkg-config
          sudo apt-get install -y libwebkit2gtk-4.1-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Compile Desktop Binary via Wails
        run: ${{ matrix.build_cmd }}

      - name: Compress macOS Bundle
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          zip -r ../../${{ matrix.artifact_name }} DezuxkStudio.app

      - name: Rename Artifact (Windows / Linux)
        if: runner.os != 'macOS'
        run: |
          mv ${{ matrix.built_path }} ${{ matrix.artifact_name }}

      - name: Compute Checksum (SHA-256)
        shell: bash
        run: |
          shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
