version: '3'

# Single entry point for every build, test and release step (Windows, macOS, Linux).
# The git tag is the source of the version; override with `task build VERSION=1.2.3`.

vars:
  GIT_TAG:
    sh: git describe --tags --abbrev=0 --match "v*" 2>/dev/null || true
  VERSION: '{{.VERSION | default (trimPrefix "v" .GIT_TAG)}}'
  VERSION_OR_DEV: '{{.VERSION | default "0.0.0-dev"}}'
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  BUILD_DATE: '{{dateInZone "2006-01-02T15:04:05Z" now "UTC"}}'
  UPDATE_FEED_URL: '{{.UPDATE_FEED_URL | default ""}}'
  APP_NAME:
    sh: go run ./cmd/buildmeta name
  BUILDINFO: app/internal/buildinfo
  LDFLAGS: >-
    -s -w
    -X '{{.BUILDINFO}}.Version={{.VERSION_OR_DEV}}'
    -X '{{.BUILDINFO}}.Commit={{.COMMIT}}'
    -X '{{.BUILDINFO}}.BuildDate={{.BUILD_DATE}}'
    -X '{{.BUILDINFO}}.UpdateFeedURL={{.UPDATE_FEED_URL}}'
  # Test binaries are built here (only by the test tasks, which create it first):
  # Windows Smart App Control blocks unsigned test executables in %TEMP%.
  GOTMPDIR: '{{.ROOT_DIR}}/build/.gotmp'
  WAILS_TAGS: '{{if eq OS "linux"}}webkit2_41{{end}}'

tasks:
  default:
    cmds: [task --list]

  setup:
    desc: Install frontend dependencies
    dir: frontend
    cmds: [npm ci]

  gotmp:
    internal: true
    cmds:
      - cmd: mkdir -p "{{.GOTMPDIR}}"
        platforms: [linux, darwin]
      - cmd: powershell -NoProfile -Command "New-Item -ItemType Directory -Force '{{.GOTMPDIR}}' | Out-Null"
        platforms: [windows]
    status:
      - test -d "{{.GOTMPDIR}}"

  generate:
    desc: Regenerate frontend/src/contracts/generated.ts from internal/contracts
    # Skipped when no input changed, so `task dev` does not recompile the generator every time.
    sources:
      - cmd/contractgen/*.go
      - internal/contracts/*.go
      - internal/apperr/*.go
      - internal/config/*.go
      - internal/domain/**/*.go
    generates:
      - frontend/src/contracts/generated.ts
    cmds: [go run ./cmd/contractgen]

  version:sync:
    desc: Mirror VERSION into wails.json and frontend/package.json
    cmds:
      - go run ./cmd/buildmeta sync -version {{.VERSION_OR_DEV}}

  dev:
    desc: Run the desktop app with hot reload (dev build tag)
    deps: [generate]
    # -skipbindings: the frontend talks to Go through src/lib/bridge.ts typed by the
    #   generated contracts, so Wails' wailsjs/go bindings (an extra build + run) are unused.
    # -m: skip `go mod tidy` on every start; `task lint` verifies tidiness instead.
    cmds:
      - wails dev -skipbindings -m {{if .WAILS_TAGS}}-tags {{.WAILS_TAGS}}{{end}}

  build:frontend:
    desc: Type-check and bundle the frontend
    dir: frontend
    cmds: [npm run build]

  build:
    desc: Build the desktop app into build/bin
    deps: [generate, version:sync]
    cmds:
      - wails build -clean -trimpath {{if .WAILS_TAGS}}-tags {{.WAILS_TAGS}}{{end}} -ldflags "{{.LDFLAGS}}" -o "{{.APP_NAME}}-{{.VERSION_OR_DEV}}{{exeExt}}"

  build:installer:
    desc: Build the Windows NSIS installer → build/bin/<name>-setup-<version>.exe (Windows only)
    platforms: [windows]
    deps: [generate, version:sync]
    # Wails silently skips the installer when makensis is missing; fail loudly instead.
    preconditions:
      - sh: command -v makensis
        msg: "makensis not found: install NSIS (https://nsis.sourceforge.io) and add it to PATH"
    cmds:
      - wails build -trimpath -nsis -ldflags "{{.LDFLAGS}}" -o "{{.APP_NAME}}-{{.VERSION_OR_DEV}}{{exeExt}}"
      # project.nsi writes <name>-<arch>-installer.exe; give it a versioned, stable name.
      - powershell -NoProfile -Command "Move-Item -Force 'build/bin/{{.APP_NAME}}-amd64-installer.exe' 'build/bin/{{.APP_NAME}}-setup-{{.VERSION_OR_DEV}}.exe'"

  build:server:
    desc: Build the headless server into bin
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o "bin/{{.APP_NAME}}-server-{{.VERSION_OR_DEV}}{{exeExt}}" ./cmd/server

  test:
    desc: Run all Go and frontend tests
    deps: [gotmp]
    env: { GOTMPDIR: '{{.GOTMPDIR}}' }
    cmds:
      - go test ./...
      - task: test:frontend

  test:race:
    desc: Run Go tests with the race detector (requires cgo / a C compiler)
    deps: [gotmp]
    env: { CGO_ENABLED: '1', GOTMPDIR: '{{.GOTMPDIR}}' }
    cmds: [go test -race ./...]

  test:frontend:
    dir: frontend
    cmds: [npm test]

  lint:
    desc: Static checks for Go and frontend (formatting, vet, contracts, modules, eslint, types)
    deps: [build:frontend]
    cmds:
      - go vet ./...
      - cmd: test -z "$(gofmt -l cmd internal test main.go)" || (gofmt -l cmd internal test main.go; exit 1)
      - go mod tidy -diff
      - go run ./cmd/contractgen -check
      - task: lint:frontend

  lint:frontend:
    internal: true
    dir: frontend
    cmds:
      - npm run lint
      - npm run format:check

  audit:
    desc: Vulnerability scan of Go and npm dependencies
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - task: audit:frontend

  audit:frontend:
    internal: true
    dir: frontend
    cmds:
      - npm audit --audit-level=high

  check:
    desc: Everything CI runs (lint, test, audit)
    cmds:
      - task: lint
      - task: test
      - task: audit

  format:
    desc: Format Go and frontend sources
    cmds:
      - gofmt -w cmd internal test main.go
      - task: format:frontend

  format:frontend:
    internal: true
    dir: frontend
    cmds:
      - npm run format

  clean:
    desc: Remove build artifacts
    cmds:
      - cmd: rm -rf bin build/bin build/.gotmp frontend/dist
        platforms: [linux, darwin]
      - cmd: powershell -NoProfile -Command "Remove-Item -Recurse -Force -ErrorAction SilentlyContinue bin, build/bin, build/.gotmp, frontend/dist"
        platforms: [windows]
